<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master AI Search Engine</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 850px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #38bdf8;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 8px;
        }
        .search-box {
            display: flex;
            gap: 12px;
            background-color: #1e293b;
            padding: 8px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
        }
        button {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 30px 0;
        }
        .mode-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }
        .card h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .source-item {
            padding: 14px 0;
            border-bottom: 1px solid #334155;
        }
        .source-item:last-child {
            border-bottom: none;
        }
        .source-item a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .source-item a:hover {
            text-decoration: underline;
        }
        .snippet {
            color: #94a3b8;
            font-size: 0.92rem;
            margin-top: 6px;
            line-height: 1.5;
        }
        .loader {
            display: none;
            text-align: center;
            color: #38bdf8;
            font-size: 1.1rem;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌐 Nexus Search Engine</h1>
        <p>Powered by Master AI Controller Hub</p>
    </div>
    
    <div class="search-box">
        <input type="text" id="queryInput" placeholder="Ask anything or search the live web..." onkeypress="if(event.key === 'Enter') performSearch()">
        <button onclick="performSearch()">Search</button>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" id="btnDeep" onclick="setMode('ai_overview')">⚡ AI Deep Synthesis</button>
        <button class="mode-btn" id="btnQuick" onclick="setMode('quick')">🚀 Fast Web Mode</button>
    </div>

    <div class="loader" id="loader">🔎 Searching web sources and generating AI answer...</div>

    <div id="resultsArea" style="display: none;">
        <div class="card" id="aiCard">
            <h2>🤖 AI Search Analysis</h2>
            <div id="aiSummary" style="white-space: pre-wrap; line-height: 1.7; color: #e2e8f0;"></div>
        </div>

        <div class="card">
            <h2>🌐 Verified Web Sources</h2>
            <div id="webSources"></div>
        </div>
    </div>
</div>

<script>
    let currentMode = 'ai_overview';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnDeep').classList.toggle('active', mode === 'ai_overview');
        document.getElementById('btnQuick').classList.toggle('active', mode === 'quick');
    }

    async function performSearch() {
        const query = document.getElementById('queryInput').value.trim();
        if (!query) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultsArea').style.display = 'none';

        try {
            const url = `https://my-universal-api.onrender.com/search?query=${encodeURIComponent(query)}&mode=${currentMode}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'x-api-key': 'my_super_secret_app_key_123'
                }
            });

            if (!response.ok) throw new Error('API request failed');

            const data = await response.json();

            document.getElementById('loader').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';

            // Populate AI Overview
            document.getElementById('aiSummary').innerText = data.ai_summary;

            // Populate Web Sources
            const sourcesDiv = document.getElementById('webSources');
            sourcesDiv.innerHTML = '';
            
            if (data.web_sources.length === 0) {
                sourcesDiv.innerHTML = '<p style="color:#94a3b8;">No direct web results found.</p>';
            } else {
                data.web_sources.forEach(source => {
                    const item = document.createElement('div');
                    item.className = 'source-item';
                    item.innerHTML = `
                        <a href="${source.href}" target="_blank">${source.title}</a>
                        <div class="snippet">${source.body}</div>
                    `;
                    sourcesDiv.appendChild(item);
                });
            }

        } catch (error) {
            document.getElementById('loader').style.display = 'none';
            alert('Search failed. Render backend might be warming up, please try again in 10 seconds.');
        }
    }
</script>

</body>
</html>
